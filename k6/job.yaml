# k6 load test against arbiter in the same namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: arbiter-k6
  labels:
    app.kubernetes.io/name: arbiter-k6
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbiter-k6
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: docker.io/grafana/k6:0.57.0
          args: ["run", "--summary-export=/tmp/summary.json", "/scripts/load_test.js"]
          env:
            - name: BASE_URL
              value: "http://arbiter:8000"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: scripts
          configMap:
            name: arbiter-k6-script
