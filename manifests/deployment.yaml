apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter
  labels:
    app.kubernetes.io/name: arbiter
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arbiter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbiter
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: arbiter
      containers:
        - name: arbiter
          image: arbiter:latest  # overridden via kustomize images
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arbiter-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: maas-api-key
                  key: api-key
            - name: MLFLOW_WORKSPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
