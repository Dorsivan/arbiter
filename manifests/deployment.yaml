apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter
  namespace: arbiter
  labels:
    app.kubernetes.io/name: arbiter
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arbiter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arbiter
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: arbiter
          image: quay.io/rh-ee-dsivan/arbiter:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: arbiter-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
